  // ---------- Quantité rapide ----------
  async function bumpQty(id, delta) {
    const it = state.items.find((x) => x.id === id);
    if (!it) return;
    const q = Math.max(0, num(it.quantite) + delta);
    if (q === num(it.quantite)) return;
    await safe(() => store.update('items', id, { quantite: q, updatedAt: now() }));
    const out = document.querySelector(`.qty:has([data-id="${CSS.escape(id)}"]) output`);
    if (out) { out.classList.remove('is-bump'); void out.offsetWidth; out.classList.add('is-bump'); }
  }

  // ---------- Export ----------
  async function exportCsv() {
    const cell = (v) => { const s = String(v ?? ''); return /[";\n]/.test(s) ? `"${s.replace(/"/g, '""')}"` : s; };
    const head = ['Article', 'Catégorie', 'Quantité', 'Unité', 'Seuil', 'Zone', 'Nom de zone', 'Emplacement', 'Marque', 'État', 'Notes'];
    const rows = [...state.items].sort(byName).map((it) => {
      const z = zoneById(it.zoneId);
      return [it.nom, it.categorie, fmtQty(it.quantite), it.unite, fmtQty(it.seuil || 0), z ? z.code : '', z ? z.nom : '', it.emplacement, it.marque, it.etat, it.notes];
    });
    const csv = '﻿' + [head, ...rows].map((r) => r.map(cell).join(';')).join('\r\n');
    await shareFile('inventaire-atelier.csv', new Blob([csv], { type: 'text/csv' }));
  }

  // Sur iPhone : feuille de partage (Enregistrer dans Fichiers, Mail…) ; ailleurs : téléchargement.
  async function shareFile(filename, blob) {
    const file = new File([blob], filename, { type: blob.type });
    if (navigator.canShare && navigator.canShare({ files: [file] })) {
      try { await navigator.share({ files: [file], title: filename }); return true; }
      catch (e) { if (e && e.name === 'AbortError') return false; }
    }
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a');
    a.href = url; a.download = filename;
    document.body.appendChild(a); a.click(); a.remove();
    setTimeout(() => URL.revokeObjectURL(url), 4000);
    return true;
  }

  // ---------- Événements (délégués une seule fois sur document) ----------
  document.addEventListener('click', async (ev) => {
    const tile = ev.target.closest('[data-cat-add]');
    if (tile) { tile.disabled = true; await addFromCatalogue(Number(tile.dataset.catAdd)); return; }
    const fam = ev.target.closest('[data-fam]');
    if (fam) { catFam = fam.dataset.fam; renderCatalogue(); return; }
    const tab = ev.target.closest('.tab');
    if (tab) { setState({ tab: tab.dataset.tab }); window.scrollTo(0, 0); return; }
    const el = ev.target.closest('[data-act]');
    if (!el) return;
    const act = el.dataset.act, id = el.dataset.id;
    switch (act) {
      case 'goto': setState({ tab: el.dataset.tab }); window.scrollTo(0, 0); break;
      case 'cat': setState({ cat: el.dataset.cat }); break;
      case 'new': openItem(null); break;
      case 'edit': openItem(id); break;
      case 'move': openMove(id); break;
      case 'catalogue': openCatalogue(); break;
      case 'settings': openSettings(); break;
      case 'key-del': lsSet(LS.key, ''); $('#dlg').close(); render(); toast('Clé retirée de cet iPhone.'); break;
      case 'backup': backup(); break;
      case 'install-hide': lsSet(LS.installHidden, '1'); $('#banner').hidden = true; break;
      case 'inc': bumpQty(id, 1); break;
      case 'dec': bumpQty(id, -1); break;
      case 'csv': exportCsv(); break;
      case 'dlg-close': $('#dlg').close(); $('#dlg').classList.remove('dlg-wide'); break;
      case 'item-del': armOrRun(el, async () => {
        const dlg = $('#dlg'); const iid = dlg.dataset.itemId; const it = state.items.find((x) => x.id === iid);
        dlg.close();
        const ok = await safe(() => store.remove('items', iid), 'Article supprimé.');
        if (it && it.photoId && ok !== undefined) safe(() => store.removePhotoIfOrphan(it.photoId, iid));
      }); break;
      case 'zone-new': openZone(null); break;
      case 'zone-edit': openZone(id); break;
      case 'zone-del': armOrRun(el, async () => {
        const dlg = $('#dlg'); const zid = dlg.dataset.zoneId;
        dlg.close();
        for (const it of state.items.filter((x) => x.zoneId === zid)) await safe(() => store.update('items', it.id, { zoneId: null }));
        await safe(() => store.remove('zones', zid), 'Zone supprimée.');
      }); break;
      case 'preset': applyPreset(Number(el.dataset.i)); break;
      case 'scan-run': runScan(); break;
      case 'scan-stop': scanCtl && scanCtl.abort(); break;
      case 'scan-reset': if (state.scan.url) URL.revokeObjectURL(state.scan.url); setScan({ file: null, url: null, results: null, error: '', remarque: '' }); break;
      case 'scan-save': saveScan(); break;
      case 'plan-run': runPlan(); break;
      case 'plan-stop': planCtl && planCtl.abort(); break;
      case 'plan-apply': applyPlan(); break;
      case 'plan-discard': setPlan({ proposal: null }); break;
      case 'o-inc': bumpOrder(id, 1); break;
      case 'o-dec': bumpOrder(id, -1); break;
      case 'o-del': { const o = state.orders.find((x) => x.id === id); if (o) safe(() => store.remove('orders', id), `${o.nom} retiré de la liste.`); break; }
      case 'o-ordered': safe(() => store.update('orders', id, { statut: 'commande', orderedAt: now(), updatedAt: now() }), 'Marqué commandé.'); break;
      case 'o-ordered-all':
        for (const o of state.orders.filter((x) => x.statut === 'a_commander')) await safe(() => store.update('orders', o.id, { statut: 'commande', orderedAt: now(), updatedAt: now() }));
        toast('Tout est marqué commandé.'); break;
      case 'o-back': safe(() => store.update('orders', id, { statut: 'a_commander', orderedAt: null, updatedAt: now() })); break;
      case 'o-receive': openReceive(id); break;
      case 'o-clear': for (const o of state.orders.filter((x) => x.statut === 'recu')) await safe(() => store.remove('orders', o.id)); break;
      case 'o-suggest': { const it = state.items.find((x) => x.id === id); if (it) addOrder({ nom: it.nom, quantite: suggestQty(it), itemId: it.id }); break; }
      case 'o-suggest-all':
        for (const it of lowSuggestions()) await addOrder({ nom: it.nom, quantite: suggestQty(it), itemId: it.id }, true);
        toast('Stock bas ajouté à la liste.'); break;
      case 'o-replace': { const it = state.items.find((x) => x.id === id); if (it) addOrder({ nom: it.nom, quantite: 1, itemId: it.id }); break; }
      case 'item-order': {
        const it = state.items.find((x) => x.id === $('#dlg').dataset.itemId);
        $('#dlg').close();
        if (it) addOrder({ nom: it.nom, quantite: isLow(it) ? suggestQty(it) : 1, itemId: it.id });
        break;
      }
      case 'task-new': openTask(null); break;
      case 'task-edit': openTask(id); break;
      case 'task-done': openTaskDone(id); break;
      case 'task-reopen': safe(() => store.update('tasks', id, { statut: 'ouverte', doneAt: null, updatedAt: now() }), 'Tâche rouverte.'); break;
      case 'task-shop': {
        const t = state.tasks.find((x) => x.id === id);
        const n = t ? await shopForTask(t) : 0;
        toast(n ? `${n} article${n > 1 ? 's' : ''} ajouté${n > 1 ? 's' : ''} aux courses.` : 'Rien à ajouter.');
        break;
      }
      case 'task-del': armOrRun(el, async () => {
        const dlg = $('#dlg'); const tid = dlg.dataset.taskId;
        dlg.close();
        await safe(() => store.remove('tasks', tid), 'Tâche supprimée.');
      }); break;
      case 'need-add': {
        $('#t-needs').insertAdjacentHTML('beforeend', needRowHtml());
        const rows = document.querySelectorAll('#t-needs .need-nom');
        rows[rows.length - 1].focus();
        break;
      }
      case 'need-del': {
        const row = el.closest('.need-row');
        if (document.querySelectorAll('#t-needs .need-row').length > 1) row.remove();
        else row.querySelectorAll('input').forEach((i) => { i.value = i.classList.contains('need-q') ? '1' : ''; });
        break;
      }
      case 'copy-list': {
        const text = shoppingText();
        try { await navigator.clipboard.writeText(text); toast('Liste copiée.'); }
        catch (_) { toast('Copie refusée par le navigateur.'); }
        break;
      }
    }
  });

  document.addEventListener('input', (ev) => {
    const t = ev.target;
    if (t.id === 'q') { state = { ...state, q: t.value }; render(); return; }
    if (t.id === 'cat-q') { catQ = t.value; const pos = t.selectionStart; renderCatalogue(); const n = $('#cat-q'); if (n) { n.focus(); try { n.setSelectionRange(pos, pos); } catch (_) {} } return; }
    const bind = t.dataset && t.dataset.bind;
    if (!bind) return;
    const i = Number(t.dataset.i);
    const patchRow = (patch, rerender) => {
      const results = state.scan.results.map((r, k) => (k === i ? { ...r, ...patch } : r));
      state = { ...state, scan: { ...state.scan, results } };
      if (rerender) render();
    };
    if (bind === 'found-nom') patchRow({ nom: t.value, merge: !!findMatch(t.value) }, false);
    else if (bind === 'found-q') patchRow({ quantite: Math.max(0, num(t.value, 0)) }, false);
    else if (bind === 'plan-notes') state = { ...state, plan: { ...state.plan, notes: t.value } };
  });

  document.addEventListener('change', async (ev) => {
    const t = ev.target;
    if (t.id === 'scan-file') { pickScanFile(t.files && t.files[0]); return; }
    if (t.id === 's-restore') { if (t.files && t.files[0]) restore(t.files[0]); t.value = ''; return; }
    if (t.id === 'i-photo') {
      const f = t.files && t.files[0];
      if (!f) return;
      try {
        const { img, url } = await loadImage(f);
        const data = toThumb(img);
        URL.revokeObjectURL(url);
        $('#dlg').dataset.newPhoto = data;
        $('#i-thumb').innerHTML = `<img alt="" src="${data}">`;
      } catch (_) { toast('Cette image ne peut pas être ouverte.'); }
      return;
    }
    const bind = t.dataset && t.dataset.bind;
    if (!bind) return;
    const i = Number(t.dataset.i);
    const patchRow = (patch) => {
      const results = state.scan.results.map((r, k) => (k === i ? { ...r, ...patch } : r));
      setScan({ results });
    };
    if (bind === 'found-keep') patchRow({ keep: t.checked });
    else if (bind === 'found-cat') patchRow({ categorie: t.value });
    else if (bind === 'found-merge') patchRow({ merge: t.value === 'merge' });
    else if (bind === 'found-nom' || bind === 'found-q') render();
    else if (bind === 'scan-zone') state = { ...state, scan: { ...state.scan, zoneId: t.value } };
  });

  document.addEventListener('submit', (ev) => {
    ev.preventDefault();
    if (ev.target.id === 'item-form') submitItem();
    if (ev.target.id === 'zone-form') submitZone();
    if (ev.target.id === 'settings-form') submitSettings();
    if (ev.target.id === 'receive-form') submitReceive();
    if (ev.target.id === 'task-form') submitTask();
    if (ev.target.id === 'task-done-form') submitTaskDone();
    if (ev.target.id === 'order-form') {
      const nom = $('#o-nom').value.trim();
      if (!nom) return;
      addOrder({ nom, quantite: Math.max(0, num($('#o-q').value, 1)) || 1, unite: $('#o-unite').value.trim() }).then(() => { const n = $('#o-nom'); if (n) n.focus(); });
    }
    if (ev.target.id === 'move-form') { const dlg = $('#dlg'); const id = dlg.dataset.moveId; const zid = $('#m-zone').value; const empl = $('#m-empl').value.trim(); dlg.close(); moveItem(id, zid, empl); }
  });

  let dragId = null;
  document.addEventListener('dragstart', (ev) => {
    const li = ev.target.closest && ev.target.closest('[data-drag]');
    if (!li) return;
    dragId = li.dataset.drag;
    li.classList.add('is-dragging');
    try { ev.dataTransfer.setData('text/plain', dragId); ev.dataTransfer.effectAllowed = 'move'; } catch (_) {}
  });
  document.addEventListener('dragend', () => { dragId = null; document.querySelectorAll('.is-dragging, .is-target').forEach((el) => el.classList.remove('is-dragging', 'is-target')); });
  ['dragover', 'dragleave', 'drop'].forEach((type) => document.addEventListener(type, (ev) => {
    const zone = dragId && ev.target.closest && ev.target.closest('[data-zone]');
    if (zone) {
      ev.preventDefault();
      if (type === 'dragover') { ev.dataTransfer.dropEffect = 'move'; zone.classList.add('is-target'); }
      else zone.classList.remove('is-target');
      if (type === 'drop') {
        const it = state.items.find((x) => x.id === dragId);
        const target = zone.dataset.zone;
        if (it && (it.zoneId || '') !== target) moveItem(dragId, target, target ? '' : it.emplacement);
        dragId = null;
      }
      return;
    }
    const drop = ev.target.closest && ev.target.closest('#drop');
    if (!drop) return;
    ev.preventDefault();
    drop.classList.toggle('is-over', type === 'dragover');
    if (type === 'drop') pickScanFile(ev.dataTransfer.files && ev.dataTransfer.files[0]);
  }));

  // ---------- Démarrage ----------
  function showInstallHint() {
    const standalone = window.navigator.standalone === true || window.matchMedia('(display-mode: standalone)').matches;
    const ios = /iPhone|iPad|iPod/.test(navigator.userAgent) || (navigator.platform === 'MacIntel' && navigator.maxTouchPoints > 1);
    if (standalone || !ios || lsGet(LS.installHidden)) return;
    const b = $('#banner');
    b.hidden = false;
    b.innerHTML = `<p class="install"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 3v12M8 7l4-4 4 4"/><path d="M5 12v7a2 2 0 0 0 2 2h10a2 2 0 0 0 2-2v-7"/></svg>
      <span><strong>Installer Établi :</strong> touchez <strong>Partager</strong> dans Safari, puis <strong>Sur l'écran d'accueil</strong>.</span>
      <button class="btn btn--sm btn--ghost" data-act="install-hide">OK</button></p>`;
  }

  async function init() {
    const [items, zones, orders, tasks] = await Promise.all([idb.all('items'), idb.all('zones'), idb.all('orders'), idb.all('tasks')]);
    state = { ...state, items, zones, orders, tasks, phase: 'live' };
    renderWho();
    render();
    showInstallHint();
    if (navigator.storage && navigator.storage.persist) navigator.storage.persist().catch(() => {});
  }

  if ('serviceWorker' in navigator && window.isSecureContext) {
    window.addEventListener('load', () => navigator.serviceWorker.register('sw.js').catch((e) => console.error(e)));
  }

  $('#dlg').addEventListener('close', () => $('#dlg').classList.remove('dlg-wide'));

  render();
  init().catch((e) => {
    console.error(e);
    $('#view').innerHTML = '<div class="empty"><h3>Stockage indisponible</h3><p>Safari bloque le stockage (navigation privée ?). Ouvrez Établi depuis l\'écran d\'accueil ou une fenêtre normale.</p></div>';
  });
})();
</script>
</body>
