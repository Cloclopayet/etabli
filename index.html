<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Établi</title>
<meta name="description" content="Inventaire d'atelier : photo, reconnaissance des outils, zones de rangement, liste à racheter.">
<meta name="theme-color" content="#6a4fc4">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Établi">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<link rel="manifest" href="manifest.json">
<link rel="icon" type="image/png" sizes="192x192" href="icon-192.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Big+Shoulders+Display:wght@600;800&family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@500;600&display=swap">
<style>
/* Layout : app mobile d'abord — en-tête « panneau perforé », contenu 960px max, barre d'onglets fixe en bas. */
:root {
  --bg: #eceef0;
  --panel: #ffffff;
  --panel-2: #f5f6f7;
  --ink: #1b2126;
  --muted: #5b6670;
  --line: #d3d8dc;
  --accent: #6a4fc4;
  --accent-ink: #ffffff;
  --accent-text: #5a3fb4;
  --ok: #2d7a4c;
  --warn: #b8336a;
  --bad: #b3261e;
  --dot: rgba(27, 33, 38, .14);
  --shadow: 0 1px 2px rgba(27, 33, 38, .08), 0 6px 20px rgba(27, 33, 38, .06);
  --f-display: "Big Shoulders Display", "Arial Narrow", Impact, sans-serif;
  --f-body: "IBM Plex Sans", system-ui, -apple-system, "Segoe UI", sans-serif;
  --f-mono: "IBM Plex Mono", ui-monospace, "SF Mono", Menlo, monospace;
  --r: 10px;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #14181b; --panel: #1d2226; --panel-2: #232a2f; --ink: #e7ebee; --muted: #9ba6af;
    --line: #333c43; --accent: #9d86f0; --accent-ink: #14181b; --accent-text: #b3a1f5;
    --ok: #5cc28a; --warn: #f27aa8; --bad: #f2776c; --dot: rgba(231, 235, 238, .09);
    --shadow: 0 1px 2px rgba(0,0,0,.4); color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #14181b; --panel: #1d2226; --panel-2: #232a2f; --ink: #e7ebee; --muted: #9ba6af;
  --line: #333c43; --accent: #9d86f0; --accent-ink: #14181b; --accent-text: #b3a1f5;
  --ok: #5cc28a; --warn: #f27aa8; --bad: #f2776c; --dot: rgba(231, 235, 238, .09);
  --shadow: 0 1px 2px rgba(0,0,0,.4); color-scheme: dark;
}
* { box-sizing: border-box; }
html { color-scheme: light; -webkit-text-size-adjust: 100%; }
body { margin: 0; -webkit-tap-highlight-color: transparent; }
img { max-width: 100%; }
[hidden] { display: none !important; }
input, select, textarea { font-size: 16px; } /* évite le zoom auto de Safari iOS */
body { background: var(--bg); color: var(--ink); font: 15px/1.5 var(--f-body); }
button, input, select, textarea { font: inherit; color: inherit; }
h1, h2, h3 { font-family: var(--f-display); letter-spacing: .01em; text-wrap: balance; margin: 0; line-height: 1.05; }
:focus-visible { outline: 3px solid var(--accent); outline-offset: 2px; }
@media (prefers-reduced-motion: reduce) { * { transition: none !important; animation: none !important; } }

/* ---- En-tête ---- */
.top {
  background-color: var(--panel);
  background-image: radial-gradient(var(--dot) 1.6px, transparent 1.7px);
  background-size: 18px 18px;
  border-bottom: 1px solid var(--line);
}
.top__in { max-width: 960px; margin: 0 auto; padding: calc(18px + env(safe-area-inset-top, 0px)) max(16px, env(safe-area-inset-right, 0px)) 16px max(16px, env(safe-area-inset-left, 0px)); display: grid; gap: 14px; }
.brand { display: flex; align-items: flex-end; justify-content: space-between; gap: 12px; flex-wrap: wrap; }
.brand h1 { font-size: clamp(2.2rem, 7vw, 3rem); font-weight: 800; text-transform: uppercase; }
.brand h1 span { background: var(--accent); color: var(--accent-ink); padding: 0 .18em; }
.who { font-size: 13px; color: var(--muted); display: flex; align-items: center; gap: 8px; }
.who img { width: 24px; height: 24px; border-radius: 50%; }
.stats { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 8px; }
.stat { background: var(--panel); border: 1px solid var(--line); border-radius: 8px; padding: 8px 10px; min-width: 0; }
.stat b { display: block; font: 800 1.6rem/1 var(--f-display); font-variant-numeric: tabular-nums; }
.stat small { color: var(--muted); font-size: 12px; text-transform: uppercase; letter-spacing: .06em; }
.stat--alert b { color: var(--warn); }

.banner { max-width: 960px; margin: 12px auto 0; padding: 0 16px; }
.banner p { margin: 0; padding: 10px 12px; border-radius: 8px; border: 1px dashed var(--line); background: var(--panel-2); font-size: 13.5px; color: var(--muted); }
.banner p strong { color: var(--ink); }

/* ---- Contenu ---- */
main { max-width: 960px; margin: 0 auto; padding-inline: 16px; padding-block: 18px calc(96px + env(safe-area-inset-bottom, 0px)); display: grid; gap: 16px; }
.section-head { display: flex; align-items: center; justify-content: space-between; gap: 10px; flex-wrap: wrap; }
.section-head h2 { font-size: 1.9rem; font-weight: 800; text-transform: uppercase; }
.lead { color: var(--muted); margin: 4px 0 0; max-width: 62ch; }

.btn { display: inline-flex; align-items: center; justify-content: center; gap: 6px; border: 1px solid var(--line); background: var(--panel); border-radius: 8px; padding: 8px 14px; cursor: pointer; font-weight: 500; min-height: 40px; }
.btn:hover { border-color: var(--muted); }
.btn:disabled { opacity: .5; cursor: not-allowed; }
.btn--main { background: var(--accent); color: var(--accent-ink); border-color: transparent; font-weight: 600; }
.btn--main:hover { filter: brightness(1.05); border-color: transparent; }
.btn--ghost { background: transparent; }
.btn--danger { color: var(--bad); }
.btn--danger.is-armed { background: var(--bad); color: #fff; border-color: transparent; }
.btn--sm { min-height: 32px; padding: 4px 10px; font-size: 13.5px; }

.toolbar { display: flex; gap: 8px; flex-wrap: wrap; }
.search { flex: 1 1 240px; min-width: 0; position: relative; }
.search input { width: 100%; padding: 10px 12px 10px 38px; border: 1px solid var(--line); border-radius: 8px; background: var(--panel); min-height: 42px; }
.search svg { position: absolute; left: 12px; top: 50%; transform: translateY(-50%); color: var(--muted); }
.chips { display: flex; gap: 6px; overflow-x: auto; padding-bottom: 4px; scrollbar-width: thin; }
.chip { flex: none; border: 1px solid var(--line); background: var(--panel); border-radius: 999px; padding: 4px 12px; font-size: 13px; cursor: pointer; white-space: nowrap; }
.chip[aria-pressed="true"] { background: var(--ink); color: var(--bg); border-color: var(--ink); }
.chip i { font-style: normal; color: var(--muted); margin-left: 4px; font-variant-numeric: tabular-nums; }
.chip[aria-pressed="true"] i { color: inherit; opacity: .7; }

/* Liste d'articles */
.list { display: grid; gap: 8px; }
.item { display: grid; grid-template-columns: 56px minmax(0, 1fr) auto auto; gap: 12px; align-items: center; background: var(--panel); border: 1px solid var(--line); border-radius: var(--r); padding: 8px; }
.thumb { width: 56px; height: 56px; border-radius: 6px; background: var(--panel-2); object-fit: cover; display: grid; place-items: center; color: var(--muted); font: 600 11px var(--f-mono); overflow: hidden; }
.thumb img { width: 100%; height: 100%; object-fit: cover; }
.item__main { min-width: 0; cursor: pointer; background: none; border: 0; padding: 0; text-align: left; }
.item__name { font-weight: 600; overflow-wrap: anywhere; }
.item__meta { display: flex; gap: 6px; flex-wrap: wrap; align-items: center; margin-top: 3px; font-size: 12.5px; color: var(--muted); }
.tag { font: 600 11.5px/1 var(--f-mono); padding: 4px 6px; border-radius: 4px; background: var(--accent); color: var(--accent-ink); letter-spacing: .04em; }
.tag--none { background: transparent; color: var(--muted); border: 1px dashed var(--line); }
.pill { font-size: 11.5px; padding: 2px 8px; border-radius: 999px; border: 1px solid currentColor; }
.pill--low { color: var(--warn); }
.pill--fix { color: var(--bad); }
.pill--ex { color: var(--muted); }
.qty { display: flex; align-items: center; border: 1px solid var(--line); border-radius: 8px; overflow: hidden; }
.qty button { width: 36px; height: 38px; border: 0; background: var(--panel-2); cursor: pointer; font-size: 18px; line-height: 1; }
.qty button:hover { background: var(--line); }
.qty output { min-width: 44px; text-align: center; font: 600 15px var(--f-mono); font-variant-numeric: tabular-nums; padding: 0 4px; }
.qty output small { display: block; font: 400 10px var(--f-body); color: var(--muted); margin-top: -2px; }

.empty { text-align: center; padding: 36px 16px; border: 2px dashed var(--line); border-radius: var(--r); color: var(--muted); display: grid; gap: 10px; justify-items: center; }
.empty h3 { font-size: 1.5rem; color: var(--ink); text-transform: uppercase; }
.empty p { margin: 0; max-width: 46ch; }
.empty .toolbar { justify-content: center; }

/* Scanner */
.drop { display: grid; gap: 12px; justify-items: center; text-align: center; padding: 28px 16px; border: 2px dashed var(--line); border-radius: var(--r); background: var(--panel); }
.drop.is-over { border-color: var(--accent); background: var(--panel-2); }
.drop p { margin: 0; color: var(--muted); max-width: 48ch; }
.scan-grid { display: grid; grid-template-columns: minmax(0, 280px) minmax(0, 1fr); gap: 16px; align-items: start; }
.scan-photo { position: sticky; top: calc(12px + env(safe-area-inset-top, 0px)); display: grid; gap: 8px; }
.scan-photo img { border-radius: var(--r); border: 1px solid var(--line); width: 100%; }
.field { display: grid; gap: 4px; min-width: 0; }
.field > span { font-size: 12px; text-transform: uppercase; letter-spacing: .06em; color: var(--muted); font-weight: 600; }
.field input, .field select, .field textarea { width: 100%; padding: 8px 10px; border: 1px solid var(--line); border-radius: 8px; background: var(--panel); min-height: 40px; }
.field textarea { min-height: 80px; resize: vertical; }
.status { display: flex; align-items: center; gap: 10px; padding: 12px; border-radius: 8px; background: var(--panel-2); color: var(--muted); }
.spinner { width: 18px; height: 18px; border-radius: 50%; border: 3px solid var(--line); border-top-color: var(--accent); animation: spin .9s linear infinite; flex: none; }
@keyframes spin { to { transform: rotate(360deg); } }
.error { color: var(--bad); background: var(--panel-2); border-left: 4px solid var(--bad); padding: 10px 12px; border-radius: 6px; margin: 0; }
.found { display: grid; gap: 8px; }
.found-row { display: grid; grid-template-columns: auto minmax(0, 1fr); gap: 10px; background: var(--panel); border: 1px solid var(--line); border-radius: var(--r); padding: 10px; }
.found-row.is-off { opacity: .55; }
.found-row input[type="checkbox"] { width: 20px; height: 20px; margin-top: 8px; accent-color: var(--accent); }
.found-fields { display: grid; grid-template-columns: minmax(0, 2fr) 90px minmax(0, 1.4fr); gap: 8px; }
.found-extra { grid-column: 1 / -1; display: flex; flex-wrap: wrap; gap: 8px; align-items: center; font-size: 12.5px; color: var(--muted); }
.found-extra select { padding: 4px 8px; border: 1px solid var(--line); border-radius: 6px; background: var(--panel); min-height: 32px; }
.conf { font-family: var(--f-mono); }
.note { font-size: 13px; color: var(--muted); margin: 0; }

/* Rangement */
.zones { display: grid; grid-template-columns: repeat(auto-fill, minmax(260px, 1fr)); gap: 12px; }
.zone { background: var(--panel); border: 1px solid var(--line); border-radius: var(--r); display: grid; grid-template-rows: auto 1fr; overflow: hidden; }
.zone__head { display: grid; grid-template-columns: auto minmax(0, 1fr) auto; gap: 10px; align-items: center; padding: 10px; border-bottom: 1px solid var(--line); background: var(--panel-2); }
.zone__code { font: 600 15px/1 var(--f-mono); background: var(--accent); color: var(--accent-ink); padding: 8px 8px; border-radius: 4px; min-width: 40px; text-align: center; letter-spacing: .04em; }
.zone__name { font-weight: 600; overflow-wrap: anywhere; }
.zone__type { font-size: 12px; color: var(--muted); }
.zone ul { list-style: none; margin: 0; padding: 6px 10px 10px; display: grid; gap: 2px; font-size: 14px; }
.zone li { display: flex; justify-content: space-between; gap: 8px; padding: 4px 0; border-bottom: 1px dotted var(--line); }
.zone li:last-child { border-bottom: 0; }
.zone li button { background: none; border: 0; padding: 0; text-align: left; cursor: pointer; min-width: 0; overflow-wrap: anywhere; }
.zone li button:hover { text-decoration: underline; }
.zone li span { font-family: var(--f-mono); font-size: 12.5px; color: var(--muted); white-space: nowrap; }
.zone__empty { color: var(--muted); font-size: 13px; padding: 10px; margin: 0; }
.zone--loose .zone__code { background: transparent; color: var(--muted); border: 1px dashed var(--line); }
.panel { background: var(--panel); border: 1px solid var(--line); border-radius: var(--r); padding: 16px; display: grid; gap: 12px; }
.panel h3 { font-size: 1.35rem; text-transform: uppercase; }
.presets { display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 8px; }
.preset { text-align: left; border: 1px solid var(--line); background: var(--panel-2); border-radius: 8px; padding: 10px 12px; cursor: pointer; display: grid; gap: 4px; }
.preset:hover { border-color: var(--accent); }
.preset b { font-weight: 600; }
.preset small { color: var(--muted); font-size: 12.5px; }
.plan-table { width: 100%; border-collapse: collapse; font-size: 14px; }
.plan-table th, .plan-table td { text-align: left; padding: 6px 8px; border-bottom: 1px solid var(--line); vertical-align: top; }
.plan-table th { font-size: 12px; text-transform: uppercase; letter-spacing: .06em; color: var(--muted); }
.scroll-x { overflow-x: auto; }
.tips { margin: 0; padding-left: 18px; display: grid; gap: 4px; }
.row { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; }
.grid2 { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 10px; }
.grid3 { display: grid; grid-template-columns: 90px minmax(0, 1fr) minmax(0, 1fr); gap: 10px; }

/* À racheter */
.hazard { height: 10px; border-radius: 3px; background: repeating-linear-gradient(-45deg, var(--accent) 0 12px, var(--ink) 12px 24px); }
.shop { display: grid; gap: 6px; }
.shop-row { display: grid; grid-template-columns: minmax(0, 1fr) auto auto; gap: 10px; align-items: center; background: var(--panel); border: 1px solid var(--line); border-radius: 8px; padding: 10px 12px; }
.shop-row b { font-weight: 600; overflow-wrap: anywhere; }
.shop-row .mono { font-family: var(--f-mono); font-size: 13px; color: var(--muted); font-variant-numeric: tabular-nums; }
.add-line { display: grid; grid-template-columns: minmax(0, 1fr) 80px 110px auto; gap: 8px; align-items: end; }
.order-row { display: grid; grid-template-columns: minmax(0, 1fr) auto auto; gap: 10px; align-items: center; background: var(--panel); border: 1px solid var(--line); border-left: 4px solid var(--cat, var(--line)); border-radius: 8px; padding: 8px 10px; }
.order-row b { font-weight: 600; overflow-wrap: anywhere; }
.order-row .row { justify-content: flex-end; }
.order-row--done { opacity: .7; }
.pill--new { color: var(--accent-text); }
.pill--ok { color: var(--ok); }
.pill--wait { color: var(--muted); }
.qty--sm button { width: 30px; height: 32px; font-size: 16px; }
.qty--sm output { min-width: 40px; font-size: 14px; }
.task { background: var(--panel); border: 1px solid var(--line); border-radius: var(--r); display: grid; overflow: hidden; }
.task__head { display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 10px; align-items: center; padding: 10px 12px; background: var(--panel-2); border-bottom: 1px solid var(--line); }
.task__title { font-weight: 600; overflow-wrap: anywhere; background: none; border: 0; padding: 0; text-align: left; cursor: pointer; }
.task__title:hover { text-decoration: underline; }
.task ul { list-style: none; margin: 0; padding: 6px 12px 10px; display: grid; gap: 2px; font-size: 14px; }
.task li { display: flex; justify-content: space-between; gap: 8px; padding: 4px 0; border-bottom: 1px dotted var(--line); align-items: center; }
.task li:last-child { border-bottom: 0; }
.task__foot { display: flex; gap: 8px; flex-wrap: wrap; justify-content: space-between; align-items: center; padding: 8px 12px 12px; }
.task--done { opacity: .65; }
.need-row { display: grid; grid-template-columns: minmax(0, 1fr) 70px 90px auto; gap: 6px; align-items: center; }
.need-row input { width: 100%; padding: 6px 8px; border: 1px solid var(--line); border-radius: 8px; background: var(--panel); min-height: 38px; }
.needs { display: grid; gap: 6px; }
@media (max-width: 640px) {
  .add-line { grid-template-columns: minmax(0, 1fr) 70px; }
  .add-line .field:nth-child(3) { grid-column: 1; }
  .order-row { grid-template-columns: minmax(0, 1fr) auto; }
  .order-row .row { grid-column: 1 / -1; }
  .need-row { grid-template-columns: minmax(0, 1fr) 60px auto; }
  .need-row .need-u { display: none; }
}

/* Barre d'onglets */
.tabs { position: fixed; left: 0; right: 0; bottom: 0; z-index: 10; background: var(--panel); border-top: 1px solid var(--line); padding-bottom: env(safe-area-inset-bottom, 0px); }
.tabs__in { max-width: 960px; margin: 0 auto; display: grid; grid-template-columns: repeat(5, minmax(0, 1fr)); }
.tab { border: 0; background: none; padding: 8px 4px 10px; display: grid; justify-items: center; gap: 2px; cursor: pointer; color: var(--muted); font-size: 12px; font-weight: 500; position: relative; }
.tab svg { width: 22px; height: 22px; }
.tab[aria-current="page"] { color: var(--ink); }
.tab[aria-current="page"]::before { content: ""; position: absolute; top: 0; left: 25%; right: 25%; height: 3px; background: var(--accent); border-radius: 0 0 3px 3px; }
.badge { position: absolute; top: 4px; left: calc(50% + 6px); background: var(--warn); color: #fff; border-radius: 999px; font: 600 10px/16px var(--f-mono); min-width: 16px; padding: 0 4px; }

/* Fenêtre article */
dialog { border: 0; border-radius: 14px; padding: 0; width: min(560px, calc(100vw - 24px)); max-height: calc(100dvh - 32px); background: var(--panel); color: var(--ink); box-shadow: var(--shadow); }
dialog::backdrop { background: rgba(10, 12, 14, .55); }
.dlg { display: grid; gap: 14px; padding: 18px; }
.dlg h2 { font-size: 1.6rem; text-transform: uppercase; }
.dlg__photo { display: grid; grid-template-columns: 96px minmax(0, 1fr); gap: 12px; align-items: center; }
.dlg__photo .thumb { width: 96px; height: 96px; }
.dlg__foot { display: flex; justify-content: space-between; gap: 8px; flex-wrap: wrap; border-top: 1px solid var(--line); padding-top: 14px; }
.file-btn { position: relative; overflow: hidden; }
.file-btn input { position: absolute; inset: 0; opacity: 0; cursor: pointer; }

.toast { position: fixed; left: 50%; bottom: calc(80px + env(safe-area-inset-bottom, 0px)); transform: translateX(-50%); background: var(--ink); color: var(--bg); padding: 10px 16px; border-radius: 8px; font-size: 14px; z-index: 20; max-width: calc(100vw - 32px); box-shadow: var(--shadow); }
.skeleton { display: grid; gap: 8px; }
.brand__tools { display: flex; align-items: center; gap: 10px; }
.gear { width: 40px; height: 40px; border-radius: 10px; border: 1px solid var(--line); background: var(--panel); display: grid; place-items: center; cursor: pointer; color: var(--ink); padding: 0; }
.gear svg { width: 22px; height: 22px; stroke: currentColor; fill: none; stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round; }
.install { display: grid; grid-template-columns: auto minmax(0, 1fr) auto; gap: 10px; align-items: center; }
.install svg { width: 22px; height: 22px; stroke: var(--accent-text); fill: none; stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round; }
.key-ok { color: var(--ok); font-weight: 600; }
.key-missing { color: var(--warn); font-weight: 600; }
.settings-block { display: grid; gap: 8px; padding-top: 12px; border-top: 1px solid var(--line); }
.settings-block h3 { font-size: 1.1rem; text-transform: uppercase; }
.mono { font-family: var(--f-mono); }

/* ---- Ludique : couleurs par catégorie, jauge, mouvements ---- */
.thumb { position: relative; background: color-mix(in srgb, var(--cat, var(--muted)) 16%, var(--panel-2)); color: var(--cat, var(--muted)); }
.thumb svg { width: 26px; height: 26px; stroke: currentColor; fill: none; stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round; }
.item { border-left: 4px solid var(--cat, var(--line)); transition: transform .15s ease, box-shadow .15s ease; animation: pop-in .25s ease both; }
.item:hover { transform: translateY(-1px); box-shadow: var(--shadow); }
.item--low { background: color-mix(in srgb, var(--warn) 6%, var(--panel)); }
@keyframes pop-in { from { opacity: 0; transform: translateY(6px); } to { opacity: 1; transform: none; } }
.qty button:active { transform: scale(.9); }
.qty output.is-bump { animation: bump .3s ease; }
@keyframes bump { 30% { transform: scale(1.25); color: var(--accent-text); } }
.chip { transition: transform .12s ease; }
.chip:hover { transform: translateY(-1px); }
.chip .dot { display: inline-block; width: 8px; height: 8px; border-radius: 50%; background: var(--cat, var(--muted)); margin-right: 6px; vertical-align: 1px; }
.gauge { grid-column: 1 / -1; background: var(--panel); border: 1px solid var(--line); border-radius: 8px; padding: 8px 10px; display: grid; gap: 6px; }
.gauge__row { display: flex; justify-content: space-between; align-items: baseline; gap: 8px; font-size: 13px; }
.gauge__row b { font: 800 1.15rem/1 var(--f-display); font-variant-numeric: tabular-nums; }
.gauge__row span { color: var(--muted); }
.gauge__bar { height: 10px; border-radius: 999px; background: var(--panel-2); overflow: hidden; border: 1px solid var(--line); }
.gauge__fill { height: 100%; border-radius: 999px; background: repeating-linear-gradient(-45deg, var(--accent) 0 8px, color-mix(in srgb, var(--accent) 70%, var(--ink)) 8px 16px); transition: width .6s cubic-bezier(.2,.8,.2,1); }
.gauge__fill.is-full { background: var(--ok); }
.zone { transition: box-shadow .15s ease, border-color .15s ease; }
.zone.is-target { border-color: var(--accent); box-shadow: 0 0 0 3px color-mix(in srgb, var(--accent) 35%, transparent); }
.zone li { align-items: center; }
.zone li[draggable="true"] { cursor: grab; }
.zone li.is-dragging { opacity: .4; }
.zone li .li-act { display: flex; gap: 4px; align-items: center; flex: none; }
.icon-btn { width: 28px; height: 28px; border: 1px solid var(--line); background: var(--panel); border-radius: 6px; display: inline-grid; place-items: center; cursor: pointer; color: var(--muted); padding: 0; flex: none; }
.icon-btn:hover { color: var(--ink); border-color: var(--muted); }
.icon-btn svg { width: 15px; height: 15px; stroke: currentColor; fill: none; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }
.item .icon-btn { align-self: center; }
.zone--loose { border-style: dashed; }
.zone__count { font: 600 12px var(--f-mono); color: var(--muted); }
.toast { animation: toast-up .25s ease both; }
@keyframes toast-up { from { opacity: 0; transform: translate(-50%, 8px); } to { opacity: 1; transform: translate(-50%, 0); } }
.toast--win { background: var(--ok); color: #fff; }
.empty svg { width: 72px; height: 72px; stroke: var(--accent-text); fill: none; stroke-width: 1.5; stroke-linecap: round; stroke-linejoin: round; }
.tab svg { transition: transform .15s ease; }
.tab:hover svg { transform: translateY(-2px); }
.preset { transition: transform .12s ease; }
.preset:hover { transform: translateY(-1px); }
.dlg--sm { max-width: 420px; }
.dlg__from { font-size: 13px; color: var(--muted); margin: -6px 0 0; }
dialog.dlg-wide { width: min(820px, calc(100vw - 24px)); }
.cat-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); gap: 8px; max-height: 52vh; overflow-y: auto; padding: 2px; }
.cat-tile { display: grid; justify-items: center; gap: 6px; text-align: center; border: 1px solid var(--line); border-left: 4px solid var(--cat, var(--line)); background: var(--panel); border-radius: var(--r); padding: 10px 8px; cursor: pointer; transition: transform .12s ease, box-shadow .12s ease; min-width: 0; }
.cat-tile:hover { transform: translateY(-2px); box-shadow: var(--shadow); }
.cat-tile:active { transform: scale(.97); }
.cat-tile:disabled { opacity: .5; }
.cat-tile .thumb { width: 52px; height: 52px; }
.cat-tile .thumb svg { width: 30px; height: 30px; }
.cat-tile__name { font-size: 13px; font-weight: 600; line-height: 1.25; overflow-wrap: anywhere; }
.cat-tile__meta { font: 500 11px var(--f-mono); color: var(--muted); }
@media (max-width: 640px) { .item .icon-btn { grid-column: 1; grid-row: 2; justify-self: start; } .item .qty { grid-column: 2; } }

.skeleton div { height: 74px; border-radius: var(--r); background: var(--panel); border: 1px solid var(--line); }

@media (max-width: 640px) {
  .stats { grid-template-columns: repeat(2, minmax(0, 1fr)); }
  .scan-grid { grid-template-columns: minmax(0, 1fr); }
  .scan-photo { position: static; }
  .scan-photo img { max-height: 260px; object-fit: cover; }
  .found-fields { grid-template-columns: minmax(0, 1fr) 80px; }
  .found-fields .field:nth-child(3) { grid-column: 1 / -1; }
  .grid2, .grid3 { grid-template-columns: minmax(0, 1fr); }
  .item { grid-template-columns: 48px minmax(0, 1fr) auto; }
  .thumb { width: 48px; height: 48px; }
  .item .qty { grid-column: 1 / -1; justify-self: end; }
}
</style>

  const idb = {
    db: null,
    open() {
      if (this.db) return Promise.resolve(this.db);
      return new Promise((resolve, reject) => {
        const req = indexedDB.open('etabli', 2);
        req.onupgradeneeded = () => STORES.forEach((n) => { if (!req.result.objectStoreNames.contains(n)) req.result.createObjectStore(n, { keyPath: 'id' }); });
        req.onsuccess = () => { this.db = req.result; resolve(this.db); };
        req.onerror = () => reject(req.error);
      });
    },
    async run(name, mode, fn) {
      const db = await this.open();
      return new Promise((resolve, reject) => {
        const tx = db.transaction(name, mode);
        const req = fn(tx.objectStore(name));
        tx.oncomplete = () => resolve(req && req.result);
        tx.onerror = () => reject(tx.error);
        tx.onabort = () => reject(tx.error);
      });
    },
    all(name) { return this.run(name, 'readonly', (st) => st.getAll()); },
    get(name, id) { return this.run(name, 'readonly', (st) => st.get(id)); },
    put(name, rec) { return this.run(name, 'readwrite', (st) => st.put(rec)); },
    del(name, id) { return this.run(name, 'readwrite', (st) => st.delete(id)); },
    async replaceAll(name, recs) {
      const db = await this.open();
      return new Promise((resolve, reject) => {
        const tx = db.transaction(name, 'readwrite');
        const st = tx.objectStore(name);
        st.clear();
        recs.forEach((r) => st.put(r));
        tx.oncomplete = () => resolve();
        tx.onerror = () => reject(tx.error);
        tx.onabort = () => reject(tx.error);
      });
    }
  };

  // Une requête : prompt (+ image JPEG facultative) -> objet JSON conforme au schéma.
  async function askClaude(prompt, { schema, image, signal }) {
    const apiKey = lsGet(LS.key);
    if (!apiKey) throw { code: 'no_key' };
    let mod;
    try { mod = await loadSdk(); } catch (_) { throw { code: 'offline' }; }
    const Anthropic = mod.default;
    const client = new Anthropic({ apiKey, dangerouslyAllowBrowser: true });
    const content = [];
    if (image) content.push({ type: 'image', source: { type: 'base64', media_type: 'image/jpeg', data: await blobToBase64(image) } });
    content.push({ type: 'text', text: prompt });
    let response;
    try {
      response = await client.beta.messages.create({
        model: MODEL,
        max_tokens: 16000,
        betas: ['server-side-fallback-2026-07-01'],
        fallbacks: 'default',
        output_config: { effort: 'medium', format: { type: 'json_schema', schema } },
        messages: [{ role: 'user', content }]
      }, { signal });
    } catch (e) {
      if (e instanceof Anthropic.APIUserAbortError) throw { code: 'cancelled' };
      if (e instanceof Anthropic.AuthenticationError) throw { code: 'bad_key' };
      if (e instanceof Anthropic.PermissionDeniedError) throw { code: 'bad_key' };
      if (e instanceof Anthropic.RateLimitError) throw { code: 'rate_limited' };
      if (e instanceof Anthropic.BadRequestError) throw { code: /credit/i.test(e.message || '') ? 'no_credit' : 'bad_request', message: e.message };
      if (e instanceof Anthropic.APIConnectionError) throw { code: 'offline' };
      if (e instanceof Anthropic.APIError) throw { code: 'upstream', message: e.message };
      throw e;
    }
    if (response.stop_reason === 'refusal') throw { code: 'refused' };
    if (response.stop_reason === 'max_tokens') throw { code: 'truncated' };
    const text = response.content.filter((b) => b.type === 'text').map((b) => b.text).join('').trim();
    try { return JSON.parse(text); } catch (_) { throw { code: 'invalid_json' }; }
  }

      <article class="item${isLow(it) ? ' item--low' : ''}" style="--cat:${catColor(cat)}">
        ${thumb}
        <button class="item__main" data-act="edit" data-id="${esc(it.id)}">
          <div class="item__name">${esc(it.nom)}</div>
          <div class="item__meta">${meta.join('')}</div>
        </button>
        <div class="qty" aria-label="Quantité de ${esc(it.nom)}">
          <button data-act="dec" data-id="${esc(it.id)}" aria-label="Retirer un">−</button>
          <output>${esc(fmtQty(it.quantite))}<small>${esc(it.unite || 'pièce')}</small></output>
          <button data-act="inc" data-id="${esc(it.id)}" aria-label="Ajouter un">+</button>
        </div>
        <button class="icon-btn" data-act="move" data-id="${esc(it.id)}" title="Déplacer" aria-label="Déplacer ${esc(it.nom)}">${ICON_MOVE}</button>
      </article>`;
  }
  const ICON_MOVE = '<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M5 9l-3 3 3 3M9 5l3-3 3 3M15 19l-3 3-3-3M19 9l3 3-3 3M2 12h20M12 2v20"/></svg>';
  const fmtQty = (q) => { const n = num(q); return Number.isInteger(n) ? String(n) : n.toFixed(1).replace('.', ','); };

  function filteredItems() {
    const q = norm(state.q);
    return state.items
      .filter((it) => state.cat === 'all' || (it.categorie || 'Autre') === state.cat)
      .filter((it) => {
        if (!q) return true;
        const z = zoneById(it.zoneId);
        return norm([it.nom, it.marque, it.emplacement, it.notes, it.categorie, z && z.code, z && z.nom].join(' ')).includes(q);
      })
      .sort(byName);
  }

  function viewInventaire() {
    const counts = {};
    state.items.forEach((it) => { const c = it.categorie || 'Autre'; counts[c] = (counts[c] || 0) + 1; });
    const cats = CATEGORIES.filter((c) => counts[c]);
    const list = filteredItems();
    const head = `
      <div class="section-head">
        <div><h2>Inventaire</h2><p class="lead">Cherchez un outil pour savoir où il est rangé. Touchez un article pour le modifier.</p></div>
        <div class="row">
          <button class="btn" data-act="new">+ Article</button>
          <button class="btn" data-act="catalogue">Catalogue</button>
          <button class="btn btn--main" data-act="goto" data-tab="scanner">Scanner une photo</button>
        </div>
      </div>`;
    if (!state.items.length) {
      return head + `
        <div class="empty">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M3 10h18v9a1 1 0 0 1-1 1H4a1 1 0 0 1-1-1z"/><path d="M3 10l2-5h14l2 5"/><path d="M9 14h6"/><path d="M12 5v5"/></svg>
          <h3>Votre atelier est vide</h3>
          <p>Photographiez une étagère, un tiroir ou une caisse à outils : Claude reconnaît les articles et compte les quantités. Ou piochez dans le catalogue (Wago, boulons M6, chevilles, forets, filaments…) : un clic, c'est ajouté.</p>
          <div class="toolbar">
            <button class="btn btn--main" data-act="goto" data-tab="scanner">Scanner une photo</button>
            <button class="btn" data-act="catalogue">Piocher dans le catalogue</button>
            <button class="btn" data-act="new">Ajouter à la main</button>
          </div>
        </div>`;
    }
    return head + `
      <div class="toolbar">
        <label class="search">${searchIcon}<input id="q" type="search" placeholder="Où est ma scie cloche ?" value="${esc(state.q)}" autocomplete="off" aria-label="Rechercher un article"></label>
        <button class="btn" data-act="csv">Exporter CSV</button>
      </div>
      <div class="chips" role="group" aria-label="Catégories">
        <button class="chip" data-act="cat" data-cat="all" aria-pressed="${state.cat === 'all'}">Tout<i>${state.items.length}</i></button>
        ${cats.map((c) => `<button class="chip" data-act="cat" data-cat="${esc(c)}" aria-pressed="${state.cat === c}" style="--cat:${catColor(c)}"><span class="dot"></span>${esc(c)}<i>${counts[c]}</i></button>`).join('')}
      </div>
      <div class="list">
        ${list.length ? list.map(itemRow).join('') : `<p class="note">Aucun article ne correspond à « ${esc(state.q)} ».</p>`}
      </div>`;

  // ---------- Scanner ----------
  function zoneOptions(selected, emptyLabel = 'Non rangé') {
    return `<option value="">${esc(emptyLabel)}</option>` + [...state.zones].sort(byZone)
      .map((z) => `<option value="${esc(z.id)}"${z.id === selected ? ' selected' : ''}>${esc(z.code)} — ${esc(z.nom)}</option>`).join('');
  }
  const catOptions = (selected) => CATEGORIES.map((c) => `<option${c === selected ? ' selected' : ''}>${esc(c)}</option>`).join('');

  function findMatch(nom) {
    const n = norm(nom);
    if (!n) return null;
    return state.items.find((it) => norm(it.nom) === n) || null;
  }

  function viewScanner() {
    const s = state.scan;
    const head = `
      <div class="section-head">
        <div><h2>Scanner</h2><p class="lead">Une photo par rangement : un tiroir ouvert, une étagère, le contenu d'une caisse posé à plat. Plus les objets sont séparés et éclairés, plus le comptage est juste.</p></div>
      </div>`;
    if (!hasKey()) {
      return head + `<div class="empty"><h3>Une clé API pour démarrer</h3>
        <p>La reconnaissance par photo utilise Claude avec votre propre clé API Anthropic (quelques centimes par photo). Ajoutez-la une fois dans les réglages. En attendant, le catalogue et l'ajout à la main fonctionnent.</p>
        <div class="toolbar"><button class="btn btn--main" data-act="settings">Ajouter ma clé API</button><button class="btn" data-act="catalogue">Catalogue</button></div></div>`;
    }
    if (!s.url) {
      return head + `
        <label class="drop" id="drop">
          <svg width="44" height="44" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 8V6a2 2 0 0 1 2-2h2M16 4h2a2 2 0 0 1 2 2v2M20 16v2a2 2 0 0 1-2 2h-2M8 20H6a2 2 0 0 1-2-2v-2"/><circle cx="12" cy="12" r="3.2"/></svg>
          <strong>Prendre ou choisir une photo</strong>
          <p>Sur téléphone, l'appareil photo s'ouvre. Sur ordinateur, choisissez une image ou glissez-la ici.</p>
          <span class="btn btn--main file-btn">Choisir une photo<input id="scan-file" type="file" accept="image/*"></span>
        </label>`;
    }
    let right = '';
    if (s.busy) {
      right = `<div class="status"><div class="spinner"></div><span>Claude examine la photo… (20 à 60 s)</span><button class="btn btn--sm btn--ghost" data-act="scan-stop">Arrêter</button></div>`;
    } else if (s.results) {
      const kept = s.results.filter((r) => r.keep).length;
      right = `
        ${s.remarque ? `<p class="note">${esc(s.remarque)}</p>` : ''}
        <div class="found">
          ${s.results.map((r, i) => foundRow(r, i)).join('') || '<p class="note">Aucun article reconnu sur cette photo. Essayez plus près, avec plus de lumière.</p>'}
        </div>
        <div class="row">
          <button class="btn btn--main" data-act="scan-save" ${kept ? '' : 'disabled'}>Ajouter ${kept} article${kept > 1 ? 's' : ''} à l'inventaire</button>
          <button class="btn btn--ghost" data-act="scan-reset">Nouvelle photo</button>
        </div>`;
    } else {
      right = `
        <label class="field"><span>Photo prise dans la zone</span><select id="scan-zone" data-bind="scan-zone">${zoneOptions(s.zoneId, 'Je ne sais pas / à ranger')}</select></label>
        ${s.error ? `<p class="error">${esc(s.error)}</p>` : ''}
        <div class="row">
          <button class="btn btn--main" data-act="scan-run">Reconnaître les articles</button>
          <button class="btn btn--ghost" data-act="scan-reset">Changer de photo</button>
        </div>
        <p class="note">La photo est envoyée à Claude avec votre clé API pour l'analyse, puis gardée en vignette sur votre iPhone.</p>`;
    }
    return head + `
      <div class="scan-grid">
        <div class="scan-photo"><img src="${esc(s.url)}" alt="Photo à analyser"></div>
        <div style="display:grid;gap:12px;min-width:0">${right}</div>
      </div>`;
  }

  function foundRow(r, i) {
    const match = findMatch(r.nom);
    const mergeSel = match ? `
      <select data-bind="found-merge" data-i="${i}" aria-label="Action">
        <option value="merge"${r.merge ? ' selected' : ''}>Ajouter au stock existant (${esc(fmtQty(match.quantite))} → ${esc(fmtQty(num(match.quantite) + num(r.quantite)))})</option>
        <option value="new"${!r.merge ? ' selected' : ''}>Créer un nouvel article</option>
      </select>` : '<span>Nouvel article</span>';
    return `
      <div class="found-row${r.keep ? '' : ' is-off'}">
        <input type="checkbox" data-bind="found-keep" data-i="${i}" ${r.keep ? 'checked' : ''} aria-label="Garder ${esc(r.nom)}">
        <div class="found-fields">
          <label class="field"><span>Article</span><input id="f-nom-${i}" data-bind="found-nom" data-i="${i}" value="${esc(r.nom)}"></label>
          <label class="field"><span>Qté</span><input id="f-q-${i}" data-bind="found-q" data-i="${i}" inputmode="decimal" value="${esc(fmtQty(r.quantite))}"></label>
          <label class="field"><span>Catégorie</span><select data-bind="found-cat" data-i="${i}">${catOptions(r.categorie)}</select></label>
          <div class="found-extra">
            ${mergeSel}
            ${r.unite && r.unite !== 'pièce' ? `<span>unité : ${esc(r.unite)}</span>` : ''}
            ${r.marque ? `<span>marque : ${esc(r.marque)}</span>` : ''}
            ${r.etat && r.etat !== 'bon' ? `<span class="pill pill--fix">${esc(r.etat)}</span>` : ''}
            <span class="conf" title="Confiance de la reconnaissance">${Math.round(num(r.confiance, 0.5) * 100)} %</span>
          </div>
        </div>
      </div>`;
  }

  function scanPrompt() {
    return `Tu fais l'inventaire de l'atelier d'un bricoleur à partir de la photo jointe.
Identifie chaque article distinct visible : outils, électroportatif, quincaillerie, consommables, matériaux, équipements de protection.
Règles :
- Regroupe les exemplaires identiques en une seule ligne et compte-les. Pour du vrac (vis, clous, chevilles), estime le nombre ou compte les boîtes/sachets et indique l'unité.
- Nom court et précis en français, comme sur une étiquette : type + taille/caractéristique lisible (ex. "Tournevis plat 5,5 mm", "Clé plate 13 mm", "Vis bois 4 × 40 mm").
- Ne liste pas les meubles de rangement eux-mêmes (étagère, établi), ni les objets flous que tu ne peux pas identifier.
- Bobines de filament pour imprimante 3D : categorie "Impression 3D", unite "bobine", nom du type "Filament PLA noir 1,75 mm — 1 kg" (matière, couleur, diamètre, poids si lisibles sur l'étiquette) ; une ligne par matière+couleur.
- categorie : exactement une valeur parmi ${JSON.stringify(CATEGORIES)}.
- unite : ${UNITES.map((u) => '"' + u + '"').join(', ')}.
- etat : "bon", "usé" ou "à réparer" (seulement si c'est visible, sinon "bon").
- confiance : de 0 à 1.
Réponds uniquement avec ce JSON :
{"articles":[{"nom":"Marteau de charpentier","categorie":"Outillage à main","quantite":1,"unite":"pièce","marque":"","etat":"bon","consommable":false,"confiance":0.9},{"nom":"Filament PETG bleu 1,75 mm — 1 kg","categorie":"Impression 3D","quantite":2,"unite":"bobine","marque":"","etat":"bon","consommable":true,"confiance":0.8}],"remarque":"une phrase utile sur la photo (ex. zone floue, objets cachés), ou chaîne vide"}`;
  }

  async function runScan() {
    const s = state.scan;
    if (!s.file) return;
    scanCtl = new AbortController();
    setScan({ busy: true, error: '' });
    try {
      const { img } = await loadImage(s.file);
      const blob = await toJpegBlob(img);
      const out = await askClaude(scanPrompt(), { schema: SCAN_SCHEMA(), image: blob, signal: scanCtl.signal });
      const arr = Array.isArray(out && out.articles) ? out.articles : [];
      const results = arr.filter((a) => a && a.nom).slice(0, 60).map((a) => ({
        nom: String(a.nom).slice(0, 120),
        categorie: CATEGORIES.includes(a.categorie) ? a.categorie : 'Autre',
        quantite: Math.max(0, num(a.quantite, 1)),
        unite: String(a.unite || 'pièce').slice(0, 20),
        marque: String(a.marque || '').slice(0, 60),
        etat: ETATS.includes(a.etat) ? a.etat : 'bon',
        consommable: !!a.consommable,
        confiance: Math.min(1, Math.max(0, num(a.confiance, 0.5))),
        keep: num(a.confiance, 0.5) >= 0.35,
        merge: !!findMatch(a.nom)
      }));
      setScan({ busy: false, results, remarque: String((out && out.remarque) || '').slice(0, 300) });
    } catch (e) {
      if (e && e.code === 'cancelled') { setScan({ busy: false }); return; }
      console.error(e);
      const msg = aiMessage(e, 'cette photo');
      setScan({ busy: false, error: msg });
    }
  }

  async function saveScan() {
    const s = state.scan;
    const kept = s.results.filter((r) => r.keep && norm(r.nom));
    if (!kept.length) return;
    setScan({ busy: true });
    let photoId = null;
    try {
      const { img, url } = await loadImage(s.file);
      photoId = await store.addPhoto(toThumb(img));
      URL.revokeObjectURL(url);
    } catch (e) { console.error(e); }
    let added = 0, merged = 0, failed = 0;
    for (const r of kept) {
      const match = r.merge ? findMatch(r.nom) : null;
      try {
        if (match) {
          await store.update('items', match.id, { quantite: num(match.quantite) + num(r.quantite), updatedAt: now(), ...(match.photoId ? {} : photoId ? { photoId } : {}) });
          merged++;
        } else {
          await store.add('items', {
            nom: r.nom.trim(), categorie: r.categorie, quantite: num(r.quantite), unite: r.unite, seuil: 0,
            zoneId: s.zoneId || null, emplacement: '', marque: r.marque, etat: r.etat, notes: '',
            photoId, createdAt: now(), updatedAt: now()
          });
          added++;
        }
      } catch (e) { console.error(e); failed++; }
    }
    if (s.url) URL.revokeObjectURL(s.url);
    state = { ...state, scan: { file: null, url: null, zoneId: s.zoneId, busy: false, error: '', results: null, remarque: '' }, tab: 'inventaire' };
    render();
    toast(failed ? `${added + merged} enregistrés, ${failed} en échec.` : `${added} ajouté${added > 1 ? 's' : ''}, ${merged} mis à jour.`);
  }

  function pickScanFile(file) {
    if (!file) return;
    if (!/^image\//.test(file.type) && file.type) { toast('Choisissez un fichier image.'); return; }
    if (state.scan.url) URL.revokeObjectURL(state.scan.url);
    setScan({ file, url: URL.createObjectURL(file), results: null, error: '', remarque: '' });
  }

  // ---------- Rangement ----------
  function viewRangement() {
    const p = state.plan;
    const zones = [...state.zones].sort(byZone);
    const loose = state.items.filter((it) => !zoneById(it.zoneId)).sort(byName);
    const zoneLi = (it) => `<li draggable="true" data-drag="${esc(it.id)}"><button data-act="edit" data-id="${esc(it.id)}">${esc(it.nom)}${it.emplacement ? ` <small style="color:var(--muted)">· ${esc(it.emplacement)}</small>` : ''}</button><span class="li-act"><span>× ${esc(fmtQty(it.quantite))}</span><button class="icon-btn" data-act="move" data-id="${esc(it.id)}" title="Déplacer" aria-label="Déplacer ${esc(it.nom)}">${ICON_MOVE}</button></span></li>`;
    const zoneCard = (z) => {
      const its = state.items.filter((it) => it.zoneId === z.id).sort(byName);
      return `
        <section class="zone" data-zone="${esc(z.id)}">
          <div class="zone__head">
            <span class="zone__code">${esc(z.code)}</span>
            <div style="min-width:0"><div class="zone__name">${esc(z.nom)}</div><div class="zone__type">${esc(z.type || '')}${z.description ? ' · ' + esc(z.description) : ''}</div></div>
            <div class="row" style="flex-wrap:nowrap"><span class="zone__count">${its.length}</span><button class="btn btn--sm btn--ghost" data-act="zone-edit" data-id="${esc(z.id)}" aria-label="Modifier la zone ${esc(z.code)}">Modifier</button></div>
          </div>
          ${its.length ? `<ul>${its.map(zoneLi).join('')}</ul>` : '<p class="zone__empty">Rien ici pour l\'instant. Glissez un article ici, ou utilisez « Déplacer ».</p>'}
        </section>`;
    };
    const plan = state.items.length ? `
      <div class="panel">
        <h3>Plan de rangement proposé par Claude</h3>
        <p class="note">Claude répartit vos ${state.items.length} articles dans ${zones.length ? 'vos zones' : 'des zones qu\'il propose'} : outils du quotidien près de l'établi, lourd en bas, vrac en bacs étiquetés, produits dangereux fermés.</p>
        <label class="field"><span>Décrivez votre atelier (facultatif)</span>
          <textarea id="plan-notes" data-bind="plan-notes" placeholder="Garage 3 × 5 m, établi sous la fenêtre, un mur libre de 3 m, enfants à la maison…">${esc(p.notes)}</textarea></label>
        ${p.error ? `<p class="error">${esc(p.error)}</p>` : ''}
        ${p.busy ? '<div class="status"><div class="spinner"></div><span>Claude organise votre atelier… (20 à 60 s)</span><button class="btn btn--sm btn--ghost" data-act="plan-stop">Arrêter</button></div>'
          : `<div class="row"><button class="btn btn--main" data-act="plan-run">${p.proposal ? 'Proposer un autre plan' : 'Proposer un plan'}</button></div>`}
        ${p.proposal ? planPreview(p.proposal) : ''}
      </div>` : '';
    const presets = `
      <div class="panel">
        <h3>Partir d'un modèle</h3>
        <p class="note">Crée les zones d'un atelier type. Les codes (E, P, B…) servent d'étiquettes à coller sur vos rangements. Les zones déjà présentes sont conservées.</p>
        <div class="presets">
          ${PRESETS.map((pr, i) => `<button class="preset" data-act="preset" data-i="${i}"><b>${esc(pr.nom)}</b><small>${esc(pr.resume)}</small><small>${pr.zones.map((z) => esc(z.code)).join(' · ')}</small></button>`).join('')}
        </div>
      </div>`;
    return `
      <div class="section-head">
        <div><h2>Rangement</h2><p class="lead">Chaque zone a un code court à écrire sur une étiquette. Pour déplacer un article : glissez-le d'une zone à l'autre, ou touchez la flèche « Déplacer ».</p></div>
        <button class="btn" data-act="zone-new">+ Zone</button>
      </div>
      ${zones.length || loose.length ? `<div class="zones">
        ${zones.map(zoneCard).join('')}
        ${loose.length ? `<section class="zone zone--loose" data-zone=""><div class="zone__head"><span class="zone__code">?</span><div><div class="zone__name">À ranger</div><div class="zone__type">Articles sans zone · glissez-les dans une zone</div></div><span class="zone__count">${loose.length}</span></div>
          <ul>${loose.map(zoneLi).join('')}</ul></section>` : ''}
      </div>` : ''}
      ${plan}
      ${presets}`;
  }

  function planPreview(pr) {
    const zoneName = (code) => {
      const pz = pr.zones.find((z) => z.code === code);
      const ez = state.zones.find((z) => norm(z.code) === norm(code));
      return (pz && pz.nom) || (ez && ez.nom) || '';
    };
    const rows = pr.affectations.map((a) => {
      const it = state.items.find((x) => x.id === a.id);
      return it ? `<tr><td>${esc(it.nom)}</td><td><span class="tag">${esc(a.zone)}</span> ${esc(zoneName(a.zone))}</td><td>${esc(a.emplacement)}</td></tr>` : '';
    }).join('');
    const newZones = pr.zones.filter((z) => !state.zones.some((e) => norm(e.code) === norm(z.code)));
    return `
      ${newZones.length ? `<p class="note"><strong>${newZones.length} zone${newZones.length > 1 ? 's' : ''} à créer :</strong> ${newZones.map((z) => `${esc(z.code)} (${esc(z.nom)})`).join(', ')}</p>` : ''}
      <div class="scroll-x"><table class="plan-table"><thead><tr><th>Article</th><th>Zone</th><th>Emplacement</th></tr></thead><tbody>${rows}</tbody></table></div>
      ${pr.conseils.length ? `<ul class="tips">${pr.conseils.map((c) => `<li>${esc(c)}</li>`).join('')}</ul>` : ''}
      <div class="row">
        <button class="btn btn--main" data-act="plan-apply" ${state.plan.applying ? 'disabled' : ''}>${state.plan.applying ? 'Application…' : 'Appliquer ce plan'}</button>
        <button class="btn btn--ghost" data-act="plan-discard">Ignorer</button>
      </div>`;
  }

  function planPrompt() {
    const items = state.items.slice(0, 400).map((it) => `${it.id}|${it.nom}|${it.categorie || 'Autre'}|${fmtQty(it.quantite)} ${it.unite || 'pièce'}`).join('\n');
    const zones = [...state.zones].sort(byZone).map((z) => `${z.code}|${z.nom}|${z.type || ''}|${z.description || ''}`).join('\n');
    return `Tu es un organisateur d'atelier de bricolage. Propose un plan de rangement pratique.
Principes : outils utilisés souvent à portée de main près de l'établi ; objets lourds en bas ; petites pièces et vrac dans des bacs étiquetés ; batteries et chargeurs ensemble ; produits inflammables ou toxiques dans un rangement fermé, en hauteur si des enfants passent ; regrouper par usage (perçage, vissage, mesure, peinture…).
${zones ? `Zones existantes (code|nom|type|description) — utilise-les en priorité, n'en crée que si c'est vraiment utile :\n${zones}` : 'Aucune zone n\'existe : propose 4 à 8 zones avec un code court (1 à 3 caractères, ex. E, P, B, S1).'}
Types de zone possibles : ${ZONE_TYPES.join(', ')}.
Description de l'atelier par l'utilisateur : ${state.plan.notes.trim() || '(non précisée)'}
Articles (id|nom|catégorie|quantité) :
${items}
Réponds uniquement avec ce JSON (chaque article reçoit exactement une affectation, "id" recopié tel quel) :
{"zones":[{"code":"P","nom":"Panneau perforé au-dessus de l'établi","type":"Mural","description":"Outillage à main"}],"affectations":[{"id":"...","zone":"P","emplacement":"rangée du haut, à gauche"}],"conseils":["3 à 5 conseils courts et concrets"]}
Dans "zones", liste toutes les zones utilisées (existantes et nouvelles).`;
  }

  async function runPlan() {
    if (!hasKey()) { setPlan({ error: aiMessage({ code: 'no_key' }) }); return; }
    planCtl = new AbortController();
    setPlan({ busy: true, error: '', proposal: null });
    try {
      const out = await askClaude(planPrompt(), { schema: PLAN_SCHEMA(), signal: planCtl.signal });
      const zones = (Array.isArray(out && out.zones) ? out.zones : [])
        .filter((z) => z && z.code).slice(0, 30)
        .map((z) => ({ code: String(z.code).slice(0, 6).toUpperCase(), nom: String(z.nom || z.code).slice(0, 80), type: ZONE_TYPES.includes(z.type) ? z.type : 'Étagère', description: String(z.description || '').slice(0, 120) }));
      const ids = new Set(state.items.map((it) => it.id));
      const affectations = (Array.isArray(out && out.affectations) ? out.affectations : [])
        .filter((a) => a && ids.has(String(a.id)) && a.zone)
        .map((a) => ({ id: String(a.id), zone: String(a.zone).slice(0, 6).toUpperCase(), emplacement: String(a.emplacement || '').slice(0, 80) }));
      const conseils = (Array.isArray(out && out.conseils) ? out.conseils : []).map(String).slice(0, 6);
      if (!affectations.length) { setPlan({ busy: false, error: 'Le plan reçu est vide. Relancez la proposition.' }); return; }
      setPlan({ busy: false, proposal: { zones, affectations, conseils } });
    } catch (e) {
      if (e && e.code === 'cancelled') { setPlan({ busy: false }); return; }
      console.error(e);
      const msg = aiMessage(e, 'cette demande');
      setPlan({ busy: false, error: msg });
    }
  }

  async function applyPlan() {
    const pr = state.plan.proposal;
    if (!pr) return;
    setPlan({ applying: true });
    try {
      const codeToId = new Map(state.zones.map((z) => [norm(z.code), z.id]));
      let ordre = state.zones.length;
      const used = new Set(pr.affectations.map((a) => norm(a.zone)));
      for (const z of pr.zones) {
        if (codeToId.has(norm(z.code)) || !used.has(norm(z.code))) continue;
        const id = await store.add('zones', { ...z, ordre: ordre++, createdAt: now() });
        codeToId.set(norm(z.code), id);
      }
      let n = 0;
      for (const a of pr.affectations) {
        const zid = codeToId.get(norm(a.zone));
        if (!zid) continue;
        await store.update('items', a.id, { zoneId: zid, emplacement: a.emplacement, updatedAt: now() });
        n++;
      }
      state = { ...state, plan: { ...state.plan, applying: false, proposal: null } };
      render();
      toast(`Plan appliqué : ${n} article${n > 1 ? 's' : ''} rangé${n > 1 ? 's' : ''}. Bel atelier !`, 'win');
    } catch (e) {
      console.error(e);
      setPlan({ applying: false });
      toast(dbMessage(e));
    }
  }

  async function applyPreset(i) {
    const pr = PRESETS[i];
    if (!pr) return;
    const existing = new Set(state.zones.map((z) => norm(z.code)));
    let ordre = state.zones.length, n = 0;
    for (const z of pr.zones) {
      if (existing.has(norm(z.code))) continue;
      const ok = await safe(() => store.add('zones', { ...z, ordre: ordre++, createdAt: now() }));
      if (ok === undefined) return;
      n++;
    }
    toast(n ? `${n} zone${n > 1 ? 's' : ''} créée${n > 1 ? 's' : ''}. Collez les codes sur vos rangements.` : 'Ces zones existent déjà.');
  }

  // ---------- Courses : à commander → commandé → réceptionné ----------
  const isOpen = (o) => o.statut !== 'recu';
  const catalogueMatch = (nom) => { const n = norm(nom); return n ? CATALOGUE.find((c) => norm(c.nom) === n) || null : null; };
  // L'article de l'établi qui correspond à une ligne (lien direct, sinon même nom).
  const itemFor = (x) => (x.itemId && state.items.find((it) => it.id === x.itemId)) || findMatch(x.nom);
  const sameThing = (a, b) => {
    const ia = itemFor(a), ib = itemFor(b);
    return ia && ib ? ia.id === ib.id : norm(a.nom) === norm(b.nom);
  };
  const stockOf = (x) => { const it = itemFor(x); return it ? num(it.quantite) : 0; };
  const openQty = (x) => state.orders.filter((o) => isOpen(o) && sameThing(o, x)).reduce((s, o) => s + num(o.quantite), 0);
  // Stock bas sans commande en cours : proposé en un clic.
  const lowSuggestions = () => state.items.filter((it) => isLow(it) && !state.orders.some((o) => isOpen(o) && sameThing(o, it))).sort(byName);
  const suggestQty = (it) => Math.max(1, 2 * num(it.seuil) - num(it.quantite));

  // Ajoute à la liste ; si la même chose attend déjà d'être commandée, on augmente sa quantité.
  async function addOrder(line, quiet) {
    const q = Math.max(0, num(line.quantite, 1));
    if (!q || !String(line.nom || '').trim()) return false;
    const ex = state.orders.find((o) => o.statut === 'a_commander' && sameThing(o, line));
    if (ex) {
      return safe(() => store.update('orders', ex.id, { quantite: num(ex.quantite) + q, taskId: ex.taskId || line.taskId || null, updatedAt: now() }), quiet ? '' : `${ex.nom} : ${fmtQty(num(ex.quantite) + q)} à commander.`);
    }
    const it = itemFor(line);
    const c = catalogueMatch(line.nom);
    const rec = {
      nom: it ? it.nom : String(line.nom).trim(), quantite: q,
      unite: line.unite || (it && it.unite) || (c && c.unite) || 'pièce',
      categorie: (it && it.categorie) || (c && c.cat) || line.categorie || 'Autre',
      itemId: it ? it.id : null, taskId: line.taskId || null, notes: line.notes || '',
      statut: 'a_commander', createdAt: now(), updatedAt: now()
    };
    return safe(() => store.add('orders', rec), quiet ? '' : `${rec.nom} ajouté à la liste${it ? '' : ' (nouvel article)'}.`);
  }

  function orderRow(o) {
    const it = itemFor(o);
    const task = o.taskId && state.tasks.find((t) => t.id === o.taskId);
    const meta = [];
    meta.push(it ? `<span>en stock : ${esc(fmtQty(it.quantite))} ${esc(it.unite || '')}</span>` : '<span class="pill pill--new">pas dans l\'établi</span>');
    if (task) meta.push(`<span>pour « ${esc(task.titre)} »</span>`);
    if (o.statut === 'commande' && o.orderedAt) meta.push(`<span>commandé le ${esc(new Date(o.orderedAt).toLocaleDateString('fr-FR'))}</span>`);
    if (o.statut === 'recu') meta.push(`<span class="pill pill--ok">reçu ${esc(fmtQty(o.quantiteRecue ?? o.quantite))} le ${esc(new Date(o.receivedAt).toLocaleDateString('fr-FR'))}</span>`);
    const qty = o.statut === 'a_commander'
      ? `<div class="qty qty--sm" aria-label="Quantité à commander de ${esc(o.nom)}"><button data-act="o-dec" data-id="${esc(o.id)}" aria-label="Un de moins">−</button><output>${esc(fmtQty(o.quantite))}<small>${esc(o.unite || 'pièce')}</small></output><button data-act="o-inc" data-id="${esc(o.id)}" aria-label="Un de plus">+</button></div>`
      : `<span class="mono">${esc(fmtQty(o.quantite))} ${esc(o.unite || 'pièce')}</span>`;
    const acts = o.statut === 'a_commander'
      ? `<button class="btn btn--sm" data-act="o-ordered" data-id="${esc(o.id)}">Commandé</button><button class="btn btn--sm btn--main" data-act="o-receive" data-id="${esc(o.id)}">Réceptionner</button><button class="icon-btn" data-act="o-del" data-id="${esc(o.id)}" aria-label="Retirer ${esc(o.nom)} de la liste" title="Retirer">${ICON_X}</button>`
      : o.statut === 'commande'
        ? `<button class="btn btn--sm btn--ghost" data-act="o-back" data-id="${esc(o.id)}">Annuler la commande</button><button class="btn btn--sm btn--main" data-act="o-receive" data-id="${esc(o.id)}">Réceptionner</button>`
        : '';
    return `
      <div class="order-row${o.statut === 'recu' ? ' order-row--done' : ''}" style="--cat:${catColor(o.categorie || 'Autre')}">
        <div style="min-width:0"><b>${esc(o.nom)}</b><div class="item__meta">${meta.join('')}</div></div>
        ${qty}
        ${acts ? `<div class="row">${acts}</div>` : ''}
      </div>`;
  }
  const ICON_X = '<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M6 6l12 12M18 6L6 18"/></svg>';

  function nameOptions() {
    const names = new Set([...state.items.map((it) => it.nom), ...CATALOGUE.map((c) => c.nom)]);
    return [...names].sort((a, b) => a.localeCompare(b, 'fr')).map((n) => `<option value="${esc(n)}"></option>`).join('');
  }

  function viewRacheter() {
    const todo = state.orders.filter((o) => o.statut === 'a_commander').sort(byName);
    const wait = state.orders.filter((o) => o.statut === 'commande').sort(byName);
    const done = state.orders.filter((o) => o.statut === 'recu').sort((a, b) => String(b.receivedAt).localeCompare(String(a.receivedAt))).slice(0, 15);
    const sugg = lowSuggestions();
    const fix = state.items.filter((it) => it.etat === 'à réparer').sort(byName);
    const panel = (title, body, extra = '') => `<div class="panel"><div class="section-head"><h3>${title}</h3>${extra}</div>${body}</div>`;
    return `
      <div class="section-head">
        <div><h2>Courses</h2><p class="lead">Ajoutez n'importe quel article, même s'il n'est pas encore dans l'établi. Passez-le en « Commandé », puis « Réceptionner » : le stock est mis à jour et l'article est créé s'il n'existait pas.</p></div>
        ${todo.length ? '<button class="btn btn--main" data-act="copy-list">Copier la liste</button>' : ''}
      </div>
      <div class="hazard" aria-hidden="true"></div>
      <form class="panel" id="order-form" autocomplete="off">
        <h3>Ajouter à la liste</h3>
        <div class="add-line">
          <label class="field"><span>Article</span><input id="o-nom" list="o-names" maxlength="120" placeholder="Vis inox 5 × 50, colle PU…" required></label>
          <label class="field"><span>Quantité</span><input id="o-q" inputmode="decimal" value="1"></label>
          <label class="field"><span>Unité</span><input id="o-unite" list="units-o" placeholder="pièce"></label>
          <button type="submit" class="btn btn--main">Ajouter</button>
        </div>
        <datalist id="o-names">${nameOptions()}</datalist>
        <datalist id="units-o">${UNITES.map((u) => `<option>${u}</option>`).join('')}</datalist>
      </form>
      ${sugg.length ? panel('Stock bas', `<div class="shop">${sugg.map((it) => `
          <div class="shop-row">
            <div style="min-width:0"><b>${esc(it.nom)}</b><div class="item__meta">${zoneTag(it)}<span>reste ${esc(fmtQty(it.quantite))} / seuil ${esc(fmtQty(it.seuil))}</span></div></div>
            <span class="mono">+${esc(fmtQty(suggestQty(it)))} ${esc(it.unite || 'pièce')}</span>
            <button class="btn btn--sm" data-act="o-suggest" data-id="${esc(it.id)}">Ajouter</button>
          </div>`).join('')}</div>`, sugg.length > 1 ? '<button class="btn btn--sm" data-act="o-suggest-all">Tout ajouter</button>' : '') : ''}
      ${panel(`À commander${todo.length ? ` · ${todo.length}` : ''}`, todo.length ? `<div class="shop">${todo.map(orderRow).join('')}</div>` : '<p class="note">Rien à commander pour l\'instant.</p>',
        todo.length > 1 ? '<button class="btn btn--sm" data-act="o-ordered-all">Tout marquer commandé</button>' : '')}
      ${wait.length ? panel(`Commandé, en attente · ${wait.length}`, `<div class="shop">${wait.map(orderRow).join('')}</div>`) : ''}
      ${fix.length ? panel('À réparer ou remplacer', `<div class="shop">${fix.map((it) => `
          <div class="shop-row">
            <div style="min-width:0"><b>${esc(it.nom)}</b><div class="item__meta">${zoneTag(it)}${it.notes ? `<span>${esc(it.notes)}</span>` : ''}</div></div>
            <button class="btn btn--sm" data-act="o-replace" data-id="${esc(it.id)}">Commander</button>
            <button class="btn btn--sm" data-act="edit" data-id="${esc(it.id)}">Ouvrir</button>
          </div>`).join('')}</div>`) : ''}
      ${done.length ? panel('Réceptionné récemment', `<div class="shop">${done.map(orderRow).join('')}</div>`, '<button class="btn btn--sm btn--ghost" data-act="o-clear">Vider</button>') : ''}`;
  }

  function shoppingText() {
    return 'Liste bricolage\n' + state.orders.filter((o) => o.statut === 'a_commander').sort(byName)
      .map((o) => `- ${fmtQty(o.quantite)} ${o.unite || 'pièce'} · ${o.nom}`).join('\n');
  }

  async function bumpOrder(id, delta) {
    const o = state.orders.find((x) => x.id === id);
    if (!o) return;
    const q = num(o.quantite) + delta;
    if (q <= 0) { await safe(() => store.remove('orders', id), `${o.nom} retiré de la liste.`); return; }
    await safe(() => store.update('orders', id, { quantite: q, updatedAt: now() }));
  }

  function openReceive(id) {
    const o = state.orders.find((x) => x.id === id);
    if (!o) return;
    const it = itemFor(o);
    const c = catalogueMatch(o.nom);
    const dlg = $('#dlg');
    dlg.innerHTML = `
      <form class="dlg" id="receive-form" method="dialog">
        <h2>Réceptionner</h2>
        <p class="dlg__from"><strong>${esc(o.nom)}</strong> · commandé : ${esc(fmtQty(o.quantite))} ${esc(o.unite || 'pièce')}</p>
        <label class="field"><span>Quantité reçue</span><input id="r-q" inputmode="decimal" value="${esc(fmtQty(o.quantite))}"></label>
        ${it ? `<p class="note">Dans l'établi : ${esc(fmtQty(it.quantite))} ${esc(it.unite || '')} → le stock sera augmenté.${zoneById(it.zoneId) ? ` Rangé en ${esc(zoneById(it.zoneId).code)}.` : ''}</p>`
          : `<p class="note">Cet article n'est pas encore dans l'établi : il sera créé.</p>
        <div class="grid2">
          <label class="field"><span>Catégorie</span><select id="r-cat">${catOptions(o.categorie || (c && c.cat) || 'Autre')}</select></label>
          <label class="field"><span>Alerte si ≤</span><input id="r-seuil" inputmode="decimal" value="${esc(fmtQty(c ? c.seuil : 0))}"></label>
        </div>
        <div class="grid2">
          <label class="field"><span>Zone</span><select id="r-zone">${zoneOptions('')}</select></label>
          <label class="field"><span>Emplacement précis</span><input id="r-empl" maxlength="80" placeholder="Tiroir 2, bac B-04…"></label>
        </div>`}
        <p class="note">Si vous recevez moins que commandé, le reste reste « commandé ».</p>
        <p class="error" id="r-err" hidden></p>
        <div class="dlg__foot"><span></span><div class="row"><button type="button" class="btn btn--ghost" data-act="dlg-close">Annuler</button><button type="submit" class="btn btn--main">Mettre en stock</button></div></div>
      </form>`;
    dlg.dataset.orderId = id;
    dlg.showModal();
    $('#r-q').select();
  }

  async function submitReceive() {
    const dlg = $('#dlg');
    const o = state.orders.find((x) => x.id === dlg.dataset.orderId);
    if (!o) { dlg.close(); return; }
    const q = num($('#r-q').value, NaN);
    const err = $('#r-err');
    if (!Number.isFinite(q) || q <= 0) { err.textContent = 'Indiquez la quantité reçue (plus que 0).'; err.hidden = false; return; }
    const it = itemFor(o);
    const form = it ? null : { categorie: $('#r-cat').value, seuil: Math.max(0, num($('#r-seuil').value, 0)), zoneId: $('#r-zone').value || null, emplacement: $('#r-empl').value.trim() };
    dlg.close();
    let itemId = it && it.id;
    if (it) {
      if (await safe(() => store.update('items', it.id, { quantite: num(it.quantite) + q, updatedAt: now() })) === undefined) return;
    } else {
      const c = catalogueMatch(o.nom);
      itemId = await safe(() => store.add('items', {
        nom: o.nom, categorie: form.categorie, quantite: q, unite: o.unite || 'pièce', seuil: form.seuil,
        zoneId: form.zoneId, emplacement: form.emplacement, marque: '', etat: 'bon', notes: '', pic: c ? c.pic : undefined,
        photoId: null, createdAt: now(), updatedAt: now()
      }));
      if (itemId === undefined) return;
    }
    const rest = num(o.quantite) - q;
    if (rest > 0) {
      await safe(() => store.update('orders', o.id, { quantite: rest, itemId, statut: 'commande', orderedAt: o.orderedAt || now(), updatedAt: now() }));
      const { id: _old, ...copy } = o;
      await safe(() => store.add('orders', { ...copy, quantite: q, quantiteRecue: q, itemId, statut: 'recu', receivedAt: now(), updatedAt: now() }));
      toast(`${fmtQty(q)} reçu · reste ${fmtQty(rest)} en attente.`);
    } else {
      await safe(() => store.update('orders', o.id, { quantiteRecue: q, itemId, statut: 'recu', receivedAt: now(), updatedAt: now() }));
      toast(`${o.nom} : +${fmtQty(q)} en stock${it ? '' : ' (nouvel article)'}.`, 'win');
    }
  }

  // ---------- Tâches : le matériel nécessaire, comparé à l'établi ----------
  // Ce qu'il faut encore commander pour une ligne, en tenant compte des autres tâches ouvertes et des commandes en cours.
  function missingToOrder(b, taskId) {
    const other = state.tasks.filter((t) => t.statut !== 'terminee' && t.id !== taskId)
      .flatMap((t) => t.besoins || []).filter((x) => sameThing(x, b)).reduce((s, x) => s + num(x.quantite), 0);
    return Math.min(num(b.quantite), Math.max(0, num(b.quantite) + other - stockOf(b) - openQty(b)));
  }

  function needStatus(b, taskId) {
    const need = num(b.quantite), stock = stockOf(b), unit = esc(b.unite || (itemFor(b) || {}).unite || 'pièce');
    if (stock >= need) return `<span class="pill pill--ok">en stock (${esc(fmtQty(stock))})</span>`;
    const miss = missingToOrder(b, taskId);
    if (!miss) return `<span class="pill pill--wait">en commande</span>`;
    return `<span class="pill pill--low">manque ${esc(fmtQty(miss))} ${unit}</span>`;
  }

  function viewTaches() {
    const open = state.tasks.filter((t) => t.statut !== 'terminee').sort((a, b) => String(b.createdAt).localeCompare(String(a.createdAt)));
    const done = state.tasks.filter((t) => t.statut === 'terminee').sort((a, b) => String(b.doneAt).localeCompare(String(a.doneAt)));
    const card = (t) => {
      const besoins = t.besoins || [];
      const ready = besoins.every((b) => stockOf(b) >= num(b.quantite));
      const missing = t.statut !== 'terminee' && besoins.some((b) => missingToOrder(b, t.id) > 0);
      return `
        <article class="task${t.statut === 'terminee' ? ' task--done' : ''}">
          <div class="task__head">
            <button class="task__title" data-act="task-edit" data-id="${esc(t.id)}">${esc(t.titre)}</button>
            ${t.statut === 'terminee' ? '<span class="pill pill--ok">terminée</span>' : besoins.length ? (ready ? '<span class="pill pill--ok">tout est là</span>' : '<span class="pill pill--low">matériel manquant</span>') : ''}
          </div>
          ${t.notes ? `<p class="note" style="padding:8px 12px 0">${esc(t.notes)}</p>` : ''}
          ${besoins.length ? `<ul>${besoins.map((b) => { const it = itemFor(b); const z = it && zoneById(it.zoneId); return `<li><span>${esc(fmtQty(b.quantite))} ${esc(b.unite || (it && it.unite) || 'pièce')} · ${esc(b.nom)}${z ? ` <span class="tag">${esc(z.code)}</span>` : ''}</span>${t.statut === 'terminee' ? '' : needStatus(b, t.id)}</li>`; }).join('')}</ul>` : '<p class="note" style="padding:8px 12px">Aucun matériel indiqué.</p>'}
          <div class="task__foot">
            ${t.statut === 'terminee'
              ? `<span class="note">Terminée le ${esc(new Date(t.doneAt).toLocaleDateString('fr-FR'))}</span><button class="btn btn--sm btn--ghost" data-act="task-reopen" data-id="${esc(t.id)}">Rouvrir</button>`
              : `${missing ? `<button class="btn btn--sm" data-act="task-shop" data-id="${esc(t.id)}">Ajouter les manquants aux courses</button>` : '<span></span>'}<button class="btn btn--sm btn--main" data-act="task-done" data-id="${esc(t.id)}">Terminer</button>`}
          </div>
        </article>`;
    };
    return `
      <div class="section-head">
        <div><h2>Tâches</h2><p class="lead">Notez un chantier et le matériel qu'il demande. Établi vérifie votre stock et met automatiquement ce qui manque sur la liste de courses.</p></div>
        <button class="btn btn--main" data-act="task-new">+ Tâche</button>
      </div>
      ${open.length ? `<div class="list">${open.map(card).join('')}</div>`
        : `<div class="empty"><h3>Aucune tâche en cours</h3><p>Exemple : « Poser l'étagère du garage » avec 4 chevilles Ø 8, 4 vis 5 × 60, 2 équerres. Ce qui manque part dans les courses.</p><div class="toolbar"><button class="btn btn--main" data-act="task-new">Créer une tâche</button></div></div>`}
      ${done.length ? `<details class="panel"><summary>Tâches terminées (${done.length})</summary><div class="list" style="margin-top:10px">${done.map(card).join('')}</div></details>` : ''}`;
  }

  const needRowHtml = (b = {}) => `
    <div class="need-row">
      <input class="need-nom" list="t-names" maxlength="120" placeholder="Article" value="${esc(b.nom || '')}" aria-label="Article">
      <input class="need-q" inputmode="decimal" value="${esc(fmtQty(b.quantite ?? 1))}" aria-label="Quantité">
      <input class="need-u" list="units-t" placeholder="unité" value="${esc(b.unite || '')}" aria-label="Unité">
      <button type="button" class="icon-btn" data-act="need-del" aria-label="Retirer la ligne">${ICON_X}</button>
    </div>`;

  function openTask(id) {
    const t = id ? state.tasks.find((x) => x.id === id) : null;
    const v = t || { titre: '', notes: '', besoins: [] };
    const dlg = $('#dlg');
    dlg.innerHTML = `
      <form class="dlg" id="task-form" method="dialog" autocomplete="off">
        <h2>${t ? 'Tâche' : 'Nouvelle tâche'}</h2>
        <label class="field"><span>Tâche</span><input id="t-titre" required maxlength="120" value="${esc(v.titre)}" placeholder="Poser l'étagère du garage"></label>
        <label class="field"><span>Notes</span><textarea id="t-notes" maxlength="500" placeholder="Pour samedi, mur en placo…">${esc(v.notes)}</textarea></label>
        <div class="field"><span>Matériel nécessaire</span>

  // Ajoute aux courses tout ce qui manque pour une tâche ; renvoie le nombre de lignes ajoutées.
  async function shopForTask(t) {
    let n = 0;
    for (const b of t.besoins || []) {
      const miss = missingToOrder(b, t.id);
      if (miss > 0 && await addOrder({ nom: b.nom, quantite: miss, unite: b.unite || '', itemId: b.itemId, taskId: t.id }, true) !== undefined) n++;
    }
    return n;
  }

  async function submitTask() {
    const dlg = $('#dlg');
    const id = dlg.dataset.taskId;
    const titre = $('#t-titre').value.trim();
    const err = $('#t-err');
    if (!titre) { err.textContent = 'Donnez un nom à la tâche.'; err.hidden = false; return; }
    const besoins = [...document.querySelectorAll('#t-needs .need-row')].map((row) => {
      const nom = row.querySelector('.need-nom').value.trim();
      const it = findMatch(nom);
      return { nom: it ? it.nom : nom, quantite: Math.max(0, num(row.querySelector('.need-q').value, 1)), unite: row.querySelector('.need-u').value.trim() || (it && it.unite) || '', itemId: it ? it.id : null };
    }).filter((b) => b.nom && b.quantite > 0);
    const notes = $('#t-notes').value.trim();
    dlg.close();
    let tid = id;
    if (id) { if (await safe(() => store.update('tasks', id, { titre, notes, besoins, updatedAt: now() })) === undefined) return; }
    else {
      tid = await safe(() => store.add('tasks', { titre, notes, besoins, statut: 'ouverte', createdAt: now(), updatedAt: now() }));
      if (tid === undefined) return;
    }
    const n = await shopForTask(state.tasks.find((x) => x.id === tid));
    toast(n ? `Tâche enregistrée · ${n} article${n > 1 ? 's' : ''} ajouté${n > 1 ? 's' : ''} aux courses.` : 'Tâche enregistrée · tout le matériel est disponible ou déjà commandé.', n ? '' : 'win');
  }

  async function restore(file) {
    let data;
    try { data = JSON.parse(await file.text()); } catch (_) { toast('Ce fichier n\'est pas une sauvegarde Établi.'); return; }
    const valid = data && data.app === 'etabli' && Array.isArray(data.items) && Array.isArray(data.zones) && Array.isArray(data.photos)
      && [...data.items, ...data.zones, ...data.photos].every((r) => r && typeof r.id === 'string');
    if (!valid) { toast('Ce fichier n\'est pas une sauvegarde Établi.'); return; }
    const box = $('#settings-form .settings-block:last-of-type') || $('#settings-form');
    const warn = document.createElement('div');
    warn.className = 'panel';
    warn.innerHTML = `<p class="note"><strong>Remplacer tout l'inventaire actuel</strong> (${state.items.length} articles) par la sauvegarde du ${esc(new Date(data.date).toLocaleDateString('fr-FR'))} (${data.items.length} articles) ?</p>
      <div class="row"><button type="button" class="btn btn--danger is-armed" id="s-restore-go">Remplacer</button><button type="button" class="btn btn--ghost" id="s-restore-no">Annuler</button></div>`;
    box.appendChild(warn);
    $('#s-restore-no').onclick = () => warn.remove();
    $('#s-restore-go').onclick = async () => {
      try {
        await idb.replaceAll('items', data.items);
        await idb.replaceAll('zones', data.zones);
        await idb.replaceAll('photos', data.photos);
        // Les sauvegardes v1 n'ont ni courses ni tâches.
        const orders = Array.isArray(data.orders) ? data.orders : [];
        const tasks = Array.isArray(data.tasks) ? data.tasks : [];
        await idb.replaceAll('orders', orders);
        await idb.replaceAll('tasks', tasks);
        photoCache.clear();
        $('#dlg').close();
        setState({ items: data.items, zones: data.zones, orders, tasks });
        toast(`Sauvegarde restaurée : ${data.items.length} articles.`);
      } catch (e) { console.error(e); toast(dbMessage(e)); }
    };
  }
